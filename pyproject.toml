[project]
name = "quant-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dualway", email = "dualway@126.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "loguru>=0.7.3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.2",
]

[project.scripts]
quant-demo = "quant_demo:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
